<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./index.css">
    <title>ALARM</title>
</head>
<body>

<div id="clock"></div>

<div class="panel">
    <div class="inputs">
        <input type="number" id="Hours" placeholder="Hours" min="0" max="23">
        <input type="number" id="Minutes" placeholder="Minutes" min="0" max="59">
        <input type="number" id="Seconds" placeholder="Seconds" min="0" max="59">
    </div>

    <select id="ringtone">
        <option value="./sound/sound1.mp3">Ringtone 1</option>
        <option value="./sound/sound2.mp3">Ringtone 2</option>
        <option value="./sound/sound3.mp3">Ringtone 3</option>
        <option value="./sound/sound4.mp3">Ringtone 4</option>
        <option value="./sound/sound5.mp3">Ringtone 5</option>
    </select>

    <p id="error"></p>

    <div class="buttons">
        <button id="create">Create</button>
        <button id="stop">Stop</button>
    </div>
</div>

<audio id="sound" src="./sound/sound1.mp3" loop></audio>
<audio id="sound" src="./sound/sound2.mp3" loop></audio>
<audio id="sound" src="./sound/sound3.mp3" loop></audio>
<audio id="sound" src="./sound/sound4.mp3" loop></audio>
<audio id="sound" src="./sound/sound5.mp3" loop></audio>

<div id="activeAlarmsContainer"></div>

<script src="./index.js"></script>
</body>
</html>
